<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    /* The mark is drawn on transparency, so on a dark browser tab a black
       square would be invisible. Flip both fills, keeping the shadow the same
       distance from the foreground as in light mode so the sliver reads the
       same either way. Geometry never changes. */
    .shotty-shadow { fill: #b4b4b4; }
    .shotty-mark { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .shotty-shadow { fill: #666666; }
      .shotty-mark { fill: #ffffff; }
    }
  </style>
  <rect class="shotty-shadow" x="6" y="6" width="24" height="24" rx="6"/>
  <rect class="shotty-mark" x="2" y="2" width="24" height="24" rx="6"/>
</svg>
